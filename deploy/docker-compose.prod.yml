# Optional edge if you want certbot next to nginx.
# Do not run this certbot service together with the host cron from renew-cert.sh.
# Nginx keeps 80 and 443. Certbot uses the webroot and does not bind port 80.
services:
  frontend:
    build: ..
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet || true
          sleep 12h &
          wait $$!
        done
