<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Moba Universe: профили игроков и советы по MOBA."
    />
    <title>Moba Universe — путеводитель твоего скилла</title>
    <script>
      (function () {
        const theme = localStorage.getItem('theme') || 'dark'
        const lang = localStorage.getItem('lang') || 'ru'
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.lang = lang
      })()
    </script>
    <!-- Critical colors before CSS/JS bundles load (prevents white FOUC) -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0c0e14;
        color: #eef0f6;
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #f4f6fb;
        color: #1a1f36;
      }
      #root {
        min-height: 100vh;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
