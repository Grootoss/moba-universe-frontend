map $cookie_lang $home_lang {
    default ru;
    en      en;
    ru      ru;
}

server {
    listen 80;
    server_name mobauniverse.com www.mobauniverse.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://mobauniverse.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.mobauniverse.com;

    ssl_certificate /etc/letsencrypt/live/mobauniverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobauniverse.com/privkey.pem;

    return 301 https://mobauniverse.com$request_uri;
}

server {
    listen 443 ssl;
    server_name mobauniverse.com;

    ssl_certificate /etc/letsencrypt/live/mobauniverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobauniverse.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    location /sitemap.xml {
        proxy_pass http://backend:8000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /robots.txt {
        proxy_pass http://backend:8000/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        return 301 /$home_lang;
    }

    # Prefer prerendered path/index.html, then SPA fallback
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}
