map $cookie_lang $home_lang {
    default ru;
    en      en;
    ru      ru;
}

map $uri $not_found_file {
    default /404.ru.html;
    ~^/en(/|$) /404.en.html;
}

proxy_cache_path /tmp/nginx-sitemap-cache levels=1:2 keys_zone=sitemap_cache:1m max_size=8m inactive=30m use_temp_path=off;

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml application/wasm font/woff2;

server {
    listen 80;
    server_name mobauniverse.com www.mobauniverse.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://mobauniverse.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.mobauniverse.com;

    ssl_certificate /etc/letsencrypt/live/mobauniverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobauniverse.com/privkey.pem;

    return 301 https://mobauniverse.com$request_uri;
}

server {
    listen 443 ssl;
    server_name mobauniverse.com;

    ssl_certificate /etc/letsencrypt/live/mobauniverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobauniverse.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:8000/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_cache sitemap_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
    }

    location = /feed.xml {
        proxy_pass http://backend:8000/feed.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /7f3a9c2e1b84d056a4e8c17b90d2f6a3.txt {
        proxy_pass http://backend:8000/7f3a9c2e1b84d056a4e8c17b90d2f6a3.txt;
        proxy_set_header Host $host;
    }

    location = /robots.txt {
        proxy_pass http://backend:8000/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location = / {
        return 301 /$home_lang;
    }

    # Fingerprinted Vite bundles. Immutable for a year; gzip covers the wire.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpe?g|webp|svg|woff2)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Known app routes only. Anything else is a real 404, not the SPA shell.
    location ~ ^/(ru|en)/?$ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.html;
    }

    location ~ ^/(ru|en)/(evergreen|users|login|register|profile|privacy|terms)/?$ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.html;
    }

    location ~ ^/(ru|en)/evergreen/[^/]+/?$ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1";
        error_page 404 = @article_html;
        try_files $uri $uri/index.html =404;
    }

    location @article_html {
        internal;
        rewrite ^/(ru|en)/evergreen/([^/]+)/?$ /seo/page/$1/evergreen/$2 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
    }

    location ~ ^/(ru|en)/user/[0-9]+/?$ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, follow";
        try_files $uri $uri/index.html /index.html;
    }

    location ~ ^/admin(?:/.*)?$ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 =404 @notfound;

    location @notfound {
        internal;
        add_header Cache-Control "no-store";
        try_files $not_found_file /404.ru.html;
    }
}
