<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Страница не найдена | Moba Universe</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #0c0e14;
        color: #eef0f6;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      main { max-width: 32rem; text-align: center; }
      .mark {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.25rem;
        border-radius: 0.85rem;
        display: grid;
        place-items: center;
        background: #12151e;
        font-weight: 700;
        font-size: 1.6rem;
        color: #818cf8;
      }
      p.code {
        margin: 0;
        font-size: 0.8rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #9aa3b8;
      }
      h1 { margin: 0.4rem 0 0.75rem; font-size: 2rem; letter-spacing: -0.03em; }
      p.text { margin: 0 0 1.5rem; color: #9aa3b8; line-height: 1.5; }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0.6rem 1.2rem;
        border-radius: 10px;
        background: #4f46e5;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      @media (prefers-color-scheme: light) {
        body { background: #f4f6fb; color: #1a1f36; }
        .mark { background: #fff; }
        p.code, p.text { color: #3d455c; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">M</div>
      <p class="code">404</p>
      <h1>Страница не найдена</h1>
      <p class="text">Такого адреса на Moba Universe нет. Ссылка могла устареть.</p>
      <a href="/ru">На главную</a>
    </main>
  </body>
</html>
